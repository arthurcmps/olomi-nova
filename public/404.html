<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Página não encontrada | Olomi</title>

    <meta
        name="description"
        content="A página que você procura não foi encontrada na Olomi."
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="./css/style.css?v=2.0"
    >

    <link
        rel="stylesheet"
        href="./css/404.css?v=3.0"
    >

    <script
        type="module"
        src="./js/main.js?v=2.0"
        defer
    ></script>
</head>

<body>

    <main class="not-found-page">

        <div class="not-found-decoration decoration-one"></div>
        <div class="not-found-decoration decoration-two"></div>

        <div class="not-found-content">

            <div class="not-found-symbol">
                <span>404</span>
            </div>

            <span class="not-found-eyebrow">
                Caminho não encontrado
            </span>

            <h1>
                Parece que este caminho
                ainda não foi aberto.
            </h1>

            <p>
                A página que você procura pode ter sido movida,
                removida ou simplesmente não existir mais.
            </p>

            <div class="not-found-actions">

                <a
                    href="index.html"
                    class="not-found-primary"
                >
                    Voltar para a Olomi
                </a>

                <button
                    type="button"
                    class="not-found-secondary"
                    onclick="history.back()"
                >
                    Voltar para a página anterior
                </button>

            </div>

        </div>

    </main>

</body>
</html>
